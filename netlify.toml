[build]
  publish = "frontend"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/checkr/*"
  to = "/.netlify/functions/checkr/:splat"
  status = 200

# One order contract: legacy /api/submit-order callers hit create-order
# (server-priced, same response). There is no separate submit-order function.
[[redirects]]
  from = "/api/submit-order"
  to = "/.netlify/functions/create-order"
  status = 200
  force = true

[[redirects]]
  from = "/api/applications"
  to = "/.netlify/functions/submit-application"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/apply/*"
  to = "/apply/index.html"
  status = 200

# Old tracking links (/order/?track=CDD-…, the format update-order used to
# text) go to the tracking page in the format it reads. Matches only
# when track is the sole query param, so /order/?service=… prefill links
# still open the order form. force: /order/index.html exists.
[[redirects]]
  from = "/order/"
  to = "/track/?order=:track"
  status = 301
  force = true
  query = {track = ":track"}

[[redirects]]
  from = "/order/*"
  to = "/order/index.html"
  status = 200

[[redirects]]
  from = "/track/*"
  to = "/track/index.html"
  status = 200

[[redirects]]
  from = "/status"
  to = "/driver/index.html"
  status = 200

[[redirects]]
  from = "/status/*"
  to = "/driver/index.html"
  status = 200

[[redirects]]
  from = "/driver/*"
  to = "/driver/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Self-hosted fonts: file names carry the font version (inter-v20-…), so they
# can be cached for a year.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Local development only; production build settings above are unchanged.
[dev]
  framework = "#static"
  publish = "frontend"
  port = 8888
  autoLaunch = false
