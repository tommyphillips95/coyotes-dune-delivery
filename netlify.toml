[build]
  publish = "frontend"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/checkr/*"
  to = "/.netlify/functions/checkr/:splat"
  status = 200

# One order contract: legacy /api/submit-order callers hit create-order
# (server-priced, same response). There is no separate submit-order function.
[[redirects]]
  from = "/api/submit-order"
  to = "/.netlify/functions/create-order"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/apply/*"
  to = "/apply/index.html"
  status = 200

[[redirects]]
  from = "/order/*"
  to = "/order/index.html"
  status = 200

[[redirects]]
  from = "/track/*"
  to = "/track/index.html"
  status = 200

[[redirects]]
  from = "/status"
  to = "/driver/index.html"
  status = 200

[[redirects]]
  from = "/status/*"
  to = "/driver/index.html"
  status = 200

[[redirects]]
  from = "/driver/*"
  to = "/driver/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Local development only; production build settings above are unchanged.
[dev]
  framework = "#static"
  publish = "frontend"
  port = 8888
  autoLaunch = false
