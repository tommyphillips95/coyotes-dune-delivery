<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Your Driver — Coyote's Dune Delivery</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body { font-family: Inter, system-ui, sans-serif; background: #FAF8F5; color: #2C2C2C; margin: 0; }
        .navbar { background: #fff; border-bottom: 1px solid #E5E0D8; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 64px; }
        .logo { color: #1A2F4B; font-weight: 700; text-decoration: none; }
        .track-page { max-width: 1200px; margin: 0 auto; padding: 24px; }
        .track-layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; min-height: 600px; }
        @media (max-width: 900px) { .track-layout { grid-template-columns: 1fr; } }
        .track-card { background: #fff; border: 1px solid #E5E0D8; border-radius: 14px; padding: 20px; margin-bottom: 16px; }
        .lookup-form { display: flex; flex-direction: column; gap: 10px; }
        .lookup-form input, .lookup-form button { padding: 12px; border-radius: 6px; font-size: 0.95rem; }
        .lookup-form input { border: 1.5px solid #E5E0D8; }
        .lookup-form button { border: none; background: #1A2F4B; color: #fff; font-weight: 600; cursor: pointer; }
        .eta-box { background: #1A2F4B; color: #fff; border-radius: 14px; padding: 20px; text-align: center; }
        .eta-value { font-size: 1.8rem; font-weight: 700; }
        .map-container { background: #fff; border: 1px solid #E5E0D8; border-radius: 14px; min-height: 500px; position: relative; overflow: hidden; }
        #map { width: 100%; height: 100%; min-height: 500px; }
        .hidden { display: none !important; }
        .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #4C8C64; display: inline-block; }
        .order-detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #E5E0D8; font-size: 0.88rem; }
    </style>
</head>
<body>
    <nav class="navbar"><div class="nav-container">
        <a href="/" class="logo">Coyote's Dune Delivery</a>
        <div><a href="/order/">Book</a> · <a href="/driver/">Driver</a></div>
    </div></nav>
    <main class="track-page">
        <h1>Track Your Delivery</h1>
        <p>Live driver marker every 15 seconds.</p>
        <div class="track-layout">
            <aside>
                <div class="track-card">
                    <h3>Find Your Order</h3>
                    <form class="lookup-form" id="lookupForm">
                        <input type="text" id="lookupOrderNum" placeholder="Order number (CDD-...)">
                        <input type="tel" id="lookupPhone" placeholder="Phone number">
                        <button type="submit" id="lookupBtn">Track Order</button>
                    </form>
                </div>
                <div class="track-card hidden" id="etaCard">
                    <span class="live-dot"></span> Live Tracking
                    <div class="eta-box">
                        <div>Estimated Arrival</div>
                        <div class="eta-value" id="etaValue">--</div>
                        <div id="etaUnit">minutes</div>
                    </div>
                </div>
                <div class="track-card hidden" id="driverCard">
                    <div id="driverName">Not assigned yet</div>
                    <div id="driverVehicle">--</div>
                </div>
                <div class="track-card hidden" id="orderCard">
                    <div class="order-detail-row"><span>Order #</span><span id="detailOrderNum">--</span></div>
                    <div class="order-detail-row"><span>Service</span><span id="detailService">--</span></div>
                    <div class="order-detail-row"><span>Pickup</span><span id="detailPickup">--</span></div>
                    <div class="order-detail-row"><span>Drop-off</span><span id="detailDropoff">--</span></div>
                    <div class="order-detail-row"><span>Status</span><span id="detailStatus">--</span></div>
                </div>
                <div class="track-card hidden" id="timelineCard">
                    <div id="dotPending" class="timeline-dot"></div>
                    <div id="dotAssigned" class="timeline-dot"></div>
                    <div id="dotInProgress" class="timeline-dot"></div>
                    <div id="dotCompleted" class="timeline-dot"></div>
                </div>
            </aside>
            <div class="map-container">
                <div id="mapLoading">Enter your order details to see the live map.</div>
                <div class="hidden" id="mapError"><h3>Map unavailable</h3></div>
                <div id="map" class="hidden"></div>
            </div>
        </div>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="track.js"></script>
</body>
</html>
